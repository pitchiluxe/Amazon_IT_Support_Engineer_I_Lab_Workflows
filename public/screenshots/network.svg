<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg5)"/>

  <rect x="0" y="0" width="240" height="800" fill="#0f1428"/>
  <text x="20" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">IT Support Lab</text>

  <!-- Header -->
  <g transform="translate(280, 30)">
    <text x="0" y="30" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">🌐 Network Topology</text>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#9ca3af">Warehouse IT Infrastructure Map</text>
  </g>

  <!-- Network Diagram -->
  <g transform="translate(280, 120)">
    <rect width="880" height="620" fill="#1a1f3a" rx="12"/>

    <!-- Internet Cloud -->
    <g transform="translate(390, 40)">
      <ellipse cx="50" cy="30" rx="50" ry="25" fill="#3b82f6" opacity="0.3"/>
      <ellipse cx="50" cy="30" rx="50" ry="25" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <text x="50" y="35" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">Internet</text>
    </g>

    <!-- Firewall -->
    <g transform="translate(390, 120)">
      <rect width="100" height="40" fill="#ef4444" rx="6"/>
      <text x="50" y="25" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">🔥 Firewall</text>
    </g>

    <!-- Core Switch -->
    <g transform="translate(390, 220)">
      <rect width="100" height="50" fill="#8b5cf6" rx="6"/>
      <text x="50" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Core Switch</text>
    </g>

    <!-- Distribution Switches -->
    <g transform="translate(150, 340)">
      <rect width="120" height="50" fill="#06b6d4" rx="6"/>
      <text x="60" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Dist Switch A</text>
    </g>
    <g transform="translate(380, 340)">
      <rect width="120" height="50" fill="#06b6d4" rx="6"/>
      <text x="60" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Dist Switch B</text>
    </g>
    <g transform="translate(610, 340)">
      <rect width="120" height="50" fill="#06b6d4" rx="6"/>
      <text x="60" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Dist Switch C</text>
    </g>

    <!-- Server Racks -->
    <g transform="translate(80, 460)">
      <rect width="100" height="60" fill="#10b981" rx="6"/>
      <text x="50" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">🖥 Server A</text>
      <text x="50" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">10.1.1.10</text>
    </g>
    <g transform="translate(200, 460)">
      <rect width="100" height="60" fill="#10b981" rx="6"/>
      <text x="50" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">🖥 Server B</text>
      <text x="50" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">10.1.1.11</text>
    </g>
    <g transform="translate(330, 460)">
      <rect width="100" height="60" fill="#10b981" rx="6"/>
      <text x="50" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">🖥 Server C</text>
      <text x="50" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">10.1.1.12</text>
    </g>

    <!-- Workstations -->
    <g transform="translate(490, 460)">
      <rect width="100" height="60" fill="#f59e0b" rx="6"/>
      <text x="50" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">💼 Workstations</text>
      <text x="50" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">40 devices</text>
    </g>
    <g transform="translate(610, 460)">
      <rect width="100" height="60" fill="#f59e0b" rx="6"/>
      <text x="50" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">🖨 Printers</text>
      <text x="50" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">12 devices</text>
    </g>
    <g transform="translate(730, 460)">
      <rect width="100" height="60" fill="#f59e0b" rx="6"/>
      <text x="50" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">📦 Scanners</text>
      <text x="50" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">25 devices</text>
    </g>

    <!-- Lines -->
    <line x1="440" y1="65" x2="440" y2="120" stroke="#6b7280" stroke-width="2"/>
    <line x1="440" y1="160" x2="440" y2="220" stroke="#6b7280" stroke-width="2"/>
    <line x1="440" y1="270" x2="210" y2="340" stroke="#6b7280" stroke-width="2"/>
    <line x1="440" y1="270" x2="440" y2="340" stroke="#6b7280" stroke-width="2"/>
    <line x1="440" y1="270" x2="670" y2="340" stroke="#6b7280" stroke-width="2"/>
    <line x1="210" y1="390" x2="130" y2="460" stroke="#6b7280" stroke-width="2"/>
    <line x1="210" y1="390" x2="250" y2="460" stroke="#6b7280" stroke-width="2"/>
    <line x1="440" y1="390" x2="380" y2="460" stroke="#6b7280" stroke-width="2"/>
    <line x1="670" y1="390" x2="540" y2="460" stroke="#6b7280" stroke-width="2"/>
    <line x1="670" y1="390" x2="660" y2="460" stroke="#6b7280" stroke-width="2"/>
    <line x1="670" y1="390" x2="780" y2="460" stroke="#6b7280" stroke-width="2"/>
  </g>
</svg>
