<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="800" fill="#0f1428"/>
  <text x="20" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">IT Support Lab</text>

  <g font-family="Arial" font-size="14" fill="#9ca3af">
    <text x="20" y="100">📊 Dashboard</text>
    <text x="20" y="130">🧪 Labs (22)</text>
    <text x="20" y="160">🚨 Incidents</text>
    <text x="20" y="190">🌐 Network</text>
    <text x="20" y="220">💻 Assets</text>
    <text x="20" y="250">📚 SOPs</text>
    <text x="20" y="280">📋 Projects</text>
    <text x="20" y="310">🤖 AI Tutor</text>
    <text x="20" y="340">🎯 Roadmap</text>
    <text x="20" y="370">⚡ Skills</text>
    <text x="20" y="400">📁 Portfolio</text>
    <text x="20" y="430">🎤 Interview</text>
  </g>

  <!-- Main Content -->
  <text x="280" y="60" font-family="Arial" font-size="28" font-weight="bold" fill="#fff">Welcome back, IT Engineer</text>
  <text x="280" y="90" font-family="Arial" font-size="14" fill="#9ca3af">Continue your training journey</text>

  <!-- Progress Rings -->
  <g transform="translate(280, 140)">
    <rect width="840" height="200" fill="#1a1f3a" rx="12"/>

    <g transform="translate(50, 100)">
      <circle r="50" fill="none" stroke="#374151" stroke-width="10"/>
      <circle r="50" fill="none" stroke="#3b82f6" stroke-width="10" stroke-dasharray="220 100" transform="rotate(-90)"/>
      <text x="0" y="0" text-anchor="middle" dy="5" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">68%</text>
      <text x="0" y="80" text-anchor="middle" font-family="Arial" font-size="12" fill="#9ca3af">Labs Complete</text>
    </g>

    <g transform="translate(200, 100)">
      <circle r="50" fill="none" stroke="#374151" stroke-width="10"/>
      <circle r="50" fill="none" stroke="#10b981" stroke-width="10" stroke-dasharray="280 35" transform="rotate(-90)"/>
      <text x="0" y="0" text-anchor="middle" dy="5" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">89%</text>
      <text x="0" y="80" text-anchor="middle" font-family="Arial" font-size="12" fill="#9ca3af">Avg Score</text>
    </g>

    <g transform="translate(350, 100)">
      <circle r="50" fill="none" stroke="#374151" stroke-width="10"/>
      <circle r="50" fill="none" stroke="#f59e0b" stroke-width="10" stroke-dasharray="190 125" transform="rotate(-90)"/>
      <text x="0" y="0" text-anchor="middle" dy="5" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">15</text>
      <text x="0" y="80" text-anchor="middle" font-family="Arial" font-size="12" fill="#9ca3af">Day Streak</text>
    </g>

    <g transform="translate(500, 100)">
      <circle r="50" fill="none" stroke="#374151" stroke-width="10"/>
      <circle r="50" fill="none" stroke="#8b5cf6" stroke-width="10" stroke-dasharray="250 65" transform="rotate(-90)"/>
      <text x="0" y="0" text-anchor="middle" dy="5" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">2,450</text>
      <text x="0" y="80" text-anchor="middle" font-family="Arial" font-size="12" fill="#9ca3af">Total Points</text>
    </g>
  </g>

  <!-- Next Lab Card -->
  <g transform="translate(280, 360)">
    <rect width="400" height="200" fill="#1a1f3a" rx="12"/>
    <text x="20" y="40" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Next Lab</text>
    <text x="20" y="80" font-family="Arial" font-size="20" font-weight="bold" fill="#3b82f6">Lab 14: High Availability</text>
    <text x="20" y="110" font-family="Arial" font-size="14" fill="#9ca3af">Configure clustering and failover</text>
    <text x="20" y="135" font-family="Arial" font-size="12" fill="#6b7280">⏱ 45 min  •  🟡 Intermediate</text>
    <rect x="20" y="150" width="120" height="35" fill="#3b82f6" rx="6"/>
    <text x="80" y="173" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">Start Lab →</text>
  </g>

  <!-- Recent Activity -->
  <g transform="translate(700, 360)">
    <rect width="420" height="200" fill="#1a1f3a" rx="12"/>
    <text x="20" y="40" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Recent Activity</text>
    <g font-family="Arial" font-size="13" fill="#9ca3af">
      <circle cx="30" cy="70" r="4" fill="#10b981"/>
      <text x="45" y="74">✅ Completed Lab 13: Cabling</text>
      <circle cx="30" cy="100" r="4" fill="#3b82f6"/>
      <text x="45" y="104">🔓 Unlocked Lab 14</text>
      <circle cx="30" cy="130" r="4" fill="#f59e0b"/>
      <text x="45" y="134">🏆 Earned "Network Expert" badge</text>
      <circle cx="30" cy="160" r="4" fill="#8b5cf6"/>
      <text x="45" y="164">📊 Scored 92% on Lab 12</text>
    </g>
  </g>
</svg>
