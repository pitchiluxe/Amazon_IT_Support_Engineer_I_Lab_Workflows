<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg2)"/>

  <rect x="0" y="0" width="240" height="800" fill="#0f1428"/>
  <text x="20" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">IT Support Lab</text>

  <!-- Lab Header -->
  <g transform="translate(280, 30)">
    <text x="0" y="30" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">Lab 14: High Availability & Failover</text>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#9ca3af">Phase 3 of 7 — Incident Response</text>

    <!-- Phase Progress -->
    <g transform="translate(0, 80)">
      <rect width="100" height="6" fill="#374151" rx="3"/>
      <rect width="43" height="6" fill="#3b82f6" rx="3"/>
      <text x="0" y="25" font-family="Arial" font-size="10" fill="#6b7280">43% Complete</text>
    </g>
  </g>

  <!-- Scenario Box -->
  <g transform="translate(280, 160)">
    <rect width="880" height="140" fill="#1a1f3a" rx="12"/>
    <text x="20" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#3b82f6">SCENARIO</text>
    <text x="20" y="60" font-family="Arial" font-size="14" fill="#e5e7eb">A primary file server in the warehouse has become unresponsive.</text>
    <text x="20" y="85" font-family="Arial" font-size="14" fill="#e5e7eb">Picking operations are halted. You need to failover to the</text>
    <text x="20" y="110" font-family="Arial" font-size="14" fill="#e5e7eb">secondary server within 15 minutes to restore service.</text>
  </g>

  <!-- Tasks -->
  <g transform="translate(280, 320)">
    <rect width="540" height="420" fill="#1a1f3a" rx="12"/>
    <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">✓ Tasks</text>

    <g font-family="Arial" font-size="13" fill="#9ca3af">
      <g transform="translate(20, 60)">
        <rect width="18" height="18" fill="#10b981" rx="3"/>
        <text x="6" y="14" text-anchor="middle" fill="#fff">✓</text>
        <text x="30" y="14" fill="#9ca3af" text-decoration="line-through">Check failover cluster status</text>
      </g>
      <g transform="translate(20, 90)">
        <rect width="18" height="18" fill="#10b981" rx="3"/>
        <text x="6" y="14" text-anchor="middle" fill="#fff">✓</text>
        <text x="30" y="14" fill="#9ca3af" text-decoration="line-through">Identify primary node failure</text>
      </g>
      <g transform="translate(20, 120)">
        <rect width="18" height="18" fill="#10b981" rx="3"/>
        <text x="6" y="14" text-anchor="middle" fill="#fff">✓</text>
        <text x="30" y="14" fill="#9ca3af" text-decoration="line-through">Move cluster resources to node B</text>
      </g>
      <g transform="translate(20, 150)">
        <rect width="18" height="18" fill="#3b82f6" rx="3"/>
        <text x="6" y="14" text-anchor="middle" fill="#fff">4</text>
        <text x="30" y="14" fill="#fff">Verify services are online on node B</text>
      </g>
      <g transform="translate(20, 180)">
        <rect width="18" height="18" fill="#374151" rx="3"/>
        <text x="6" y="14" text-anchor="middle" fill="#9ca3af">5</text>
        <text x="30" y="14" fill="#6b7280">Update DNS records if needed</text>
      </g>
      <g transform="translate(20, 210)">
        <rect width="18" height="18" fill="#374151" rx="3"/>
        <text x="6" y="14" text-anchor="middle" fill="#9ca3af">6</text>
        <text x="30" y="14" fill="#6b7280">Test application connectivity</text>
      </g>
      <g transform="translate(20, 240)">
        <rect width="18" height="18" fill="#374151" rx="3"/>
        <text x="6" y="14" text-anchor="middle" fill="#9ca3af">7</text>
        <text x="30" y="14" fill="#6b7280">Document incident in ticket system</text>
      </g>
    </g>
  </g>

  <!-- Incident Details -->
  <g transform="translate(840, 320)">
    <rect width="320" height="420" fill="#1a1f3a" rx="12"/>
    <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">🚨 Incident #P1-2401</text>

    <text x="20" y="60" font-family="Arial" font-size="12" fill="#9ca3af">PRIORITY</text>
    <rect x="20" y="70" width="50" height="20" fill="#ef4444" rx="4"/>
    <text x="45" y="84" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">P1</text>

    <text x="20" y="115" font-family="Arial" font-size="12" fill="#9ca3af">SLA</text>
    <text x="20" y="135" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">12:34 remaining</text>

    <text x="20" y="170" font-family="Arial" font-size="12" fill="#9ca3af">REPORTER</text>
    <text x="20" y="190" font-family="Arial" font-size="14" fill="#fff">Sarah Chen (Ops Lead)</text>

    <text x="20" y="225" font-family="Arial" font-size="12" fill="#9ca3af">AFFECTED USERS</text>
    <text x="20" y="245" font-family="Arial" font-size="14" fill="#fff">~120 pickers</text>

    <text x="20" y="280" font-family="Arial" font-size="12" fill="#9ca3af">SYMPTOMS</text>
    <text x="20" y="300" font-family="Arial" font-size="12" fill="#e5e7eb">• Files unreachable</text>
    <text x="20" y="320" font-family="Arial" font-size="12" fill="#e5e7eb">• Latency 5000ms+</text>
    <text x="20" y="340" font-family="Arial" font-size="12" fill="#e5e7eb">• Cluster error logs</text>
  </g>
</svg>
