<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>

  <rect x="0" y="0" width="240" height="800" fill="#0f1428"/>
  <text x="20" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">IT Support Lab</text>

  <!-- Header -->
  <g transform="translate(280, 30)">
    <text x="0" y="30" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">🤖 AI Tutor</text>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#9ca3af">Socratic learning — I guide, you discover</text>

    <!-- Connection Status -->
    <g transform="translate(750, 0)">
      <rect width="150" height="30" fill="#1a1f3a" rx="15"/>
      <circle cx="20" cy="15" r="5" fill="#10b981"/>
      <text x="35" y="20" font-family="Arial" font-size="12" fill="#9ca3af">Ollama • Connected</text>
    </g>
  </g>

  <!-- Chat Container -->
  <g transform="translate(280, 100)">
    <rect width="880" height="580" fill="#1a1f3a" rx="12"/>

    <!-- Messages -->
    <g transform="translate(0, 20)">
      <!-- User Message -->
      <g transform="translate(520, 0)">
        <rect width="340" height="60" fill="#3b82f6" rx="12"/>
        <text x="15" y="25" font-family="Arial" font-size="13" fill="#fff">How do I configure VLAN routing?</text>
        <text x="15" y="45" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.7)">12:34 PM</text>
      </g>

      <!-- AI Response -->
      <g transform="translate(0, 90)">
        <rect width="500" height="120" fill="#252d4a" rx="12"/>
        <text x="15" y="25" font-family="Arial" font-size="14" fill="#fff">Great question! Let me ask you something first:</text>
        <text x="15" y="50" font-family="Arial" font-size="14" fill="#fbbf24">What do you already know about how VLANs isolate traffic?</text>
        <text x="15" y="80" font-family="Arial" font-size="14" fill="#fff">Once you understand that, the routing part becomes clearer.</text>
        <text x="15" y="100" font-family="Arial" font-size="10" fill="#6b7280">12:35 PM • Model: llama3.2</text>
      </g>

      <!-- User Follow-up -->
      <g transform="translate(540, 240)">
        <rect width="320" height="60" fill="#3b82f6" rx="12"/>
        <text x="15" y="25" font-family="Arial" font-size="13" fill="#fff">I know each VLAN is a separate broadcast domain</text>
        <text x="15" y="45" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.7)">12:36 PM</text>
      </g>

      <!-- AI Response -->
      <g transform="translate(0, 330)">
        <rect width="520" height="100" fill="#252d4a" rx="12"/>
        <text x="15" y="25" font-family="Arial" font-size="14" fill="#10b981">✓ Correct! Now think about this:</text>
        <text x="15" y="50" font-family="Arial" font-size="14" fill="#fbbf24">If VLANs block broadcast traffic between them, what</text>
        <text x="15" y="70" font-family="Arial" font-size="14" fill="#fbbf24">mechanism would let them still communicate?</text>
        <text x="15" y="88" font-family="Arial" font-size="10" fill="#6b7280">12:36 PM</text>
      </g>
    </g>

    <!-- Input Area -->
    <g transform="translate(0, 520)">
      <rect width="880" height="60" fill="#252d4a" rx="12"/>
      <rect x="20" y="10" width="800" height="40" fill="#1a1f3a" rx="6"/>
      <text x="35" y="35" font-family="Arial" font-size="14" fill="#6b7280">Ask a question or paste error logs...</text>
      <rect x="780" y="15" width="70" height="30" fill="#3b82f6" rx="6"/>
      <text x="815" y="34" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Send</text>
    </g>
  </g>
</svg>
