<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg6)"/>

  <rect x="0" y="0" width="240" height="800" fill="#0f1428"/>
  <text x="20" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">IT Support Lab</text>

  <!-- Header -->
  <g transform="translate(280, 30)">
    <text x="0" y="30" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">⚡ Skills Matrix</text>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#9ca3af">Track your competency across 6 IT domains</text>
  </g>

  <!-- Skills Grid -->
  <g transform="translate(280, 110)">
    <!-- Active Directory -->
    <g transform="translate(0, 0)">
      <rect width="430" height="180" fill="#1a1f3a" rx="12"/>
      <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Active Directory</text>
      <text x="20" y="55" font-family="Arial" font-size="12" fill="#9ca3af">5/5 labs completed</text>
      <rect x="20" y="80" width="390" height="20" fill="#252d4a" rx="10"/>
      <rect x="20" y="80" width="390" height="20" fill="#3b82f6" rx="10"/>
      <text x="20" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" dx="10" dy="-3">100%</text>
      <text x="20" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ User Management</text>
      <text x="200" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ GPOs</text>
      <text x="20" y="155" font-family="Arial" font-size="12" fill="#10b981">✓ Permissions</text>
      <text x="200" y="155" font-family="Arial" font-size="12" fill="#10b981">✓ DNS Integration</text>
    </g>

    <!-- Networking -->
    <g transform="translate(450, 0)">
      <rect width="430" height="180" fill="#1a1f3a" rx="12"/>
      <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Networking</text>
      <text x="20" y="55" font-family="Arial" font-size="12" fill="#9ca3af">3/4 labs completed</text>
      <rect x="20" y="80" width="390" height="20" fill="#252d4a" rx="10"/>
      <rect x="20" y="80" width="293" height="20" fill="#8b5cf6" rx="10"/>
      <text x="20" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" dx="10" dy="-3">75%</text>
      <text x="20" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ TCP/IP</text>
      <text x="200" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ Cabling</text>
      <text x="20" y="155" font-family="Arial" font-size="12" fill="#10b981">✓ VLANs</text>
      <text x="200" y="155" font-family="Arial" font-size="12" fill="#6b7280">○ HA/Failover</text>
    </g>

    <!-- Hardware -->
    <g transform="translate(0, 200)">
      <rect width="430" height="180" fill="#1a1f3a" rx="12"/>
      <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Hardware</text>
      <text x="20" y="55" font-family="Arial" font-size="12" fill="#9ca3af">1/1 labs completed</text>
      <rect x="20" y="80" width="390" height="20" fill="#252d4a" rx="10"/>
      <rect x="20" y="80" width="390" height="20" fill="#10b981" rx="10"/>
      <text x="20" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" dx="10" dy="-3">100%</text>
      <text x="20" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ PC Repair</text>
      <text x="200" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ Imaging</text>
    </g>

    <!-- Operations -->
    <g transform="translate(450, 200)">
      <rect width="430" height="180" fill="#1a1f3a" rx="12"/>
      <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Operations</text>
      <text x="20" y="55" font-family="Arial" font-size="12" fill="#9ca3af">2/3 labs completed</text>
      <rect x="20" y="80" width="390" height="20" fill="#252d4a" rx="10"/>
      <rect x="20" y="80" width="260" height="20" fill="#f59e0b" rx="10"/>
      <text x="20" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" dx="10" dy="-3">67%</text>
      <text x="20" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ Incident Response</text>
      <text x="20" y="155" font-family="Arial" font-size="12" fill="#10b981">✓ RCA</text>
      <text x="200" y="155" font-family="Arial" font-size="12" fill="#6b7280">○ Shift Sim</text>
    </g>

    <!-- Deployment -->
    <g transform="translate(0, 400)">
      <rect width="430" height="180" fill="#1a1f3a" rx="12"/>
      <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Deployment</text>
      <text x="20" y="55" font-family="Arial" font-size="12" fill="#9ca3af">2/2 labs completed</text>
      <rect x="20" y="80" width="390" height="20" fill="#252d4a" rx="10"/>
      <rect x="20" y="80" width="390" height="20" fill="#06b6d4" rx="10"/>
      <text x="20" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" dx="10" dy="-3">100%</text>
      <text x="20" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ SCCM/MECM</text>
      <text x="200" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ Imaging</text>
    </g>

    <!-- Documentation -->
    <g transform="translate(450, 400)">
      <rect width="430" height="180" fill="#1a1f3a" rx="12"/>
      <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Documentation</text>
      <text x="20" y="55" font-family="Arial" font-size="12" fill="#9ca3af">1/2 labs completed</text>
      <rect x="20" y="80" width="390" height="20" fill="#252d4a" rx="10"/>
      <rect x="20" y="80" width="195" height="20" fill="#ec4899" rx="10"/>
      <text x="20" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" dx="10" dy="-3">50%</text>
      <text x="20" y="130" font-family="Arial" font-size="12" fill="#10b981">✓ SOPs</text>
      <text x="20" y="155" font-family="Arial" font-size="12" fill="#6b7280">○ Project Mgmt</text>
    </g>
